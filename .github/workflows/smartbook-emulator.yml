name: Smart Book native Android export experiment

on:
  push:
    paths:
      - ".github/workflows/smartbook-emulator.yml"
      - "scripts/automate_android.py"
      - "scripts/ci_smartbook.sh"
      - "books/unicorn/**"
      - "books/air-vent/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-smart-book:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Create diagnostics directory
        run: mkdir -p debug artifacts
      - name: Free runner disk space and enable KVM if available
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          df -h /
      - name: Boot emulator, install official APK and attempt export
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 3072M
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: bash scripts/ci_smartbook.sh
      - name: Upload emulator evidence and exported packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartbook-android-evidence
          path: |
            debug/
            artifacts/
          if-no-files-found: warn
          retention-days: 7
